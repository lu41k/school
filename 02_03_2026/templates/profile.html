<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — AI Aggregator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 36px;
      border-radius: 15px;
      background-color: rgba(44, 62, 80, 0.88);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 28px;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #6200ea, #7c4dff);
      font-size: 34px;
      font-weight: 700;
    }

    .user-name {
      margin: 0 0 6px;
      text-align: center;
      font-size: 21px;
    }

    .user-email {
      margin: 0 0 28px;
      text-align: center;
      color: #d0d9df;
      overflow-wrap: anywhere;
    }

    .profile-info {
      margin-bottom: 24px;
      padding: 18px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #c7d2d9;
    }

    .value {
      text-align: right;
      overflow-wrap: anywhere;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    .btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.28);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.6);
      outline-offset: 2px;
    }

    .edit-btn {
      margin-bottom: 12px;
      background: linear-gradient(135deg, #6200ea, #7c4dff 60%, #4a00e0);
    }

    .logout-btn {
      background: linear-gradient(135deg, #ff4081, #ff3d00);
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 22px;
      }

      .info-row {
        flex-direction: column;
        gap: 4px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My Profile</h1>

    <div class="avatar" aria-hidden="true">И</div>
    <h2 class="user-name"></h2>
    <p class="user-email"></p>

    <section class="profile-info" aria-label="Profile info">
      <div class="info-row">
        <span class="label">Username</span>
        <span class="value"></span>
      </div>
      <div class="info-row">
        <span class="label">Registration date</span>
        <span class="value"></span>
      </div>
      <div class="info-row">
        <span class="label">Tokens balance</span>
        <span class="value"></span>
      </div>
    </section>

    <button class="btn edit-btn" type="button" onclick="location.href='edit-profile'">
      Make a request
    </button>
    <button class="btn logout-btn" type="button" onclick="location.href='logout'">
      Log out
    </button>
  </main>
</body>
</html>
