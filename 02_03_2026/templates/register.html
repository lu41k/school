<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | AI Aggregator</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="background">
    <div class="container">
        <h1>Create Your Account at AI Aggregator</h1>
        <form action="#" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required placeholder="Enter your full name"><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Enter your email"><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required placeholder="Choose a strong password"><br>

            <button type="submit">Sign Up</button>
        </form>

        <p>Already have an account?</p>
        <a href="/">Log in here</a>
    </div>
</body>
</html>
