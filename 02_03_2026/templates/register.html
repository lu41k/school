<!DOCTYPE html>
<html lang="en">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="script.js"></script>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Registration | AI Aggregator</title>
<style>
  :root {
    --bg: #0D0D0D;
    --container: #2A2A2A;
    --text: #FFFFFF;
    --muted: #E0E0E0;
    --label: #E0E0E0;
    --input: #444;
    --border: #555;
    --accent: #BB86FC;
    --btn: #6200EA;
    --btnHover: #3700B3;
    --shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
  }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    position: relative; /* для позиционирования закрывающей кнопки */
  }
  .container {
    background-color: var(--container);
    border-radius: 12px;
    padding: 28px;
    width: 320px; /* единая фиксированная ширина */
    box-shadow: var(--shadow);
    position: relative; /* чтобы позиционировать кнопку внутри контейнера */
  }
  /* Кнопка закрытия */
  .close-btn {
    position: absolute;
    top: -18px;
    right: -18px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #FF5C5C, #E53935);
    color: white;
    font-weight: 700;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .close-btn:hover {
    transform: rotate(5deg) scale(1.04);
    box-shadow: 0 8px 16px rgba(0,0,0,0.32);
  }
  .close-btn:focus-visible {
    outline: 3px solid rgba(255,255,255,0.7);
    outline-offset: 2px;
  }

  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 18px;
    color: var(--accent);
  }
  form {
    display: grid;
    gap: 12px;
  }
  label {
    font-size: 14px;
    color: var(--label);
    display: block;
    margin-bottom: 4px;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background-color: #3a3a3a;
    color: var(--text);
  }
  input::placeholder {
    color: #b5b5b5;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #6200EA 0%, #7C4DFF 60%, #4A00E0 100%);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  .btn:hover {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 10px 18px rgba(0,0,0,0.28);
  }
  .link {
    text-align: center;
    margin-top: 14px;
  }
  a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a:hover {
    text-decoration: underline;
  }
  p {
    text-align: center;
    margin-top: 8px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="container">
  <button class="close-btn" id="closeBtn" aria-label="Close and return to main menu">×</button>
  <h1>Create Your Account</h1>
  <form action="/add-user" method="post" id="add-user">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Choose a strong password">
    </div>
    <div>
      <label for="confirm-password">Repeat Password</label>
      <input type="password" id="confirm-password" name="repeat password" required placeholder="Repeat your password">
    </div>
    <button class="btn" type="submit" id="submitBtn">Sign Up</button>
  </form>
  <p>Already have an account?</p>
  <div class="link">
    <a href="/login" aria-label="Log in">Log in here</a>
  </div>
</div>

<script>
  const closeBtn = document.getElementById('closeBtn');
  closeBtn.addEventListener('click', () => {
    document.querySelector('.container').style.transition = 'opacity 300ms ease';
    document.querySelector('.container').style.opacity = '0';
    setTimeout(() => {
      window.location.href = '/'; // или просто hide: document.querySelector('.container').style.display='none';
    }, 320);
  });
</script>
</body>
</html>
